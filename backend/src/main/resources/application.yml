spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/conciliacion}
    username: ${DB_USER:conciliacion}
    password: ${DB_PASSWORD:conciliacion}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB